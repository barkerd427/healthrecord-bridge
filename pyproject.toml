[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "healthrecord-bridge"
version = "0.2.0"
description = "Convert personal health record exports (HL7 C-CDA from Epic MyChart and others) into FHIR R4"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Barker" }]
requires-python = ">=3.11"
keywords = ["fhir", "ccda", "cda", "hl7", "health-records", "mychart", "epic", "ndjson"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Healthcare Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = ["lxml>=5.0"]

[project.urls]
Homepage = "https://github.com/barkerd427/healthrecord-bridge"
Issues = "https://github.com/barkerd427/healthrecord-bridge/issues"
Changelog = "https://github.com/barkerd427/healthrecord-bridge/blob/main/CHANGELOG.md"

[project.scripts]
hrb = "healthrecord_bridge.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/healthrecord_bridge"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow' -ra"
markers = [
  "slow: runs the whole Synthea sample set; deselected by default, enable with -m slow",
]
